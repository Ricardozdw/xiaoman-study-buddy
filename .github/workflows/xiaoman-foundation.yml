# 小满地基：后端测试 + 前端构建。不部署。
# 底座的 harness-golden 仍然单独跑（含金标）。这里再跑一遍 pytest，
# 并加上 web/ 的测试和构建，避免只改前端时没人检查。
name: Xiaoman foundation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
      - name: pytest
        env:
          AUTH_SECRET: "foundation-ci-not-a-real-secret"
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
