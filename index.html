<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小满学习搭子演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：顶部演示条 + 左栏（今天/资料）| 中间对话流 | 右侧按需工作台 */
:root{--bg:#f4f2ee;--surface:#fff;--card:#fff;--raised:#f8f7f4;--t1:#1f1d1a;--t2:#5f5a52;--t3:#736d63;--line:#e8e4dc;--ctl:#8a8478;--accent:#3f6f68;--onacc:#fff;--soft:#e9f0ee;--softfg:#24433f;--ok:#3a6f5c;--okbg:#e5f4e4;--bad:#a5452f;--badbg:#fbebeb;--warnbg:#fbf1dc;--warn:#7a5310;--pp:#f6efe6;--hl:#fff3c4;--bar:#ebe7e0;--shadow:rgba(0,0,0,.12);--font:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a19;--surface:#1f2221;--card:#242827;--raised:#2a2e2d;--t1:#ecebe7;--t2:#b3aea5;--t3:#a29d94;--line:#363b3a;--ctl:#7c776f;--accent:#7fb3aa;--onacc:#0f1a18;--soft:#26403b;--softfg:#d3ebe6;--ok:#86c7a8;--okbg:#20382c;--bad:#ef9a85;--badbg:#3e2420;--warnbg:#3a2f18;--warn:#f0c878;--pp:#2e2a25;--hl:#5a4d16;--bar:#363b3a;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181a19;--surface:#1f2221;--card:#242827;--raised:#2a2e2d;--t1:#ecebe7;--t2:#b3aea5;--t3:#a29d94;--line:#363b3a;--ctl:#7c776f;--accent:#7fb3aa;--onacc:#0f1a18;--soft:#26403b;--softfg:#d3ebe6;--ok:#86c7a8;--okbg:#20382c;--bad:#ef9a85;--badbg:#3e2420;--warnbg:#3a2f18;--warn:#f0c878;--pp:#2e2a25;--hl:#5a4d16;--bar:#363b3a;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demobar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--warnbg);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
.demobar b{font-weight:600}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--bar)}
.dots i.d{background:var(--warn)}
.demobar .hint{flex:1;min-width:0}
.demobar button{border:1px solid var(--warn);background:transparent;color:var(--warn);border-radius:8px;padding:5px 10px;font-size:13px;min-height:32px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr)}
.app.wp{grid-template-columns:240px minmax(0,1fr) min(460px,40vw)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;font-size:14px;overflow:auto}
.logo{font-weight:600;font-size:18px;color:var(--accent);margin:0 0 14px 4px}
.rh{font-size:13px;color:var(--t2);margin:14px 4px 6px;display:flex;justify-content:space-between}
.ri{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;line-height:1.45;width:100%;border:none;background:none;text-align:left;font-size:14px;min-height:44px;border-radius:10px}
.ri:not(:disabled):hover{background:var(--raised)}
.ri:disabled{cursor:default}
.fold{display:block;width:100%;border:1px dashed var(--ctl);border-radius:12px;background:var(--raised);color:var(--t2);font-size:13px;padding:10px 12px;margin:0 0 14px;min-height:44px}
.fold:disabled{cursor:default}
.ri.on{background:var(--soft);border-radius:10px;color:var(--softfg)}
.ri.done span:last-child{color:var(--t3);text-decoration:line-through}
.ri .ft{font-size:12px;color:var(--onacc);background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:4px}
.cb{width:18px;height:18px;border:2px solid var(--ctl);border-radius:5px;flex:none;margin-top:2px;position:relative}
.cb.d{background:var(--ok);border-color:var(--ok)}
.cb.d:after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--onacc);border-width:0 2px 2px 0;transform:rotate(45deg)}
.empty{font-size:13px;color:var(--t3);padding:6px}
.rl{padding:7px 6px;color:var(--t1);display:flex;justify-content:space-between;gap:8px;border-radius:10px}
.rl small{color:var(--t2);font-size:13px;white-space:nowrap}
.rl.new{background:var(--soft);color:var(--softfg)}
.rail .bot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.jump{border:1.5px dashed var(--warn);background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px;font-size:14px;min-height:44px;text-align:left}
.jump small{display:block;font-size:12px}
.jump:disabled{opacity:.45;cursor:default}
.jump.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--warnbg)}}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.ch .nm{font-size:16px;font-weight:600}
.ch .st{font-size:13px;color:var(--t2)}
.ch .day{margin-left:auto;font-size:13px;color:var(--t2)}
.stream{flex:1;min-height:0;overflow-y:auto;padding:18px 24px 6px;display:flex;flex-direction:column}
.col{width:100%;max-width:720px;margin:auto auto 0}
.msg{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(6px);opacity:.4}}
.av{width:36px;height:36px;border-radius:50%;background:var(--pp);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bd{min-width:0;flex:1}
.bub{font-size:15px;line-height:1.7;padding:6px 0 2px}
.msg.u{justify-content:flex-end}
.msg.u .bub{background:var(--soft);color:var(--softfg);border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:75%}
.att{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);font-size:14px}
.att .ico{width:26px;height:32px;border-radius:5px;background:var(--raised);font-size:10px;color:var(--t2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.att small{display:block;font-size:13px;color:var(--t2)}
.mc{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px;margin-top:6px}
.mc h4{margin:0 0 6px;font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mc h4 em{font-style:normal;font-weight:400;font-size:13px;color:var(--t2)}
.mc ul{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.75}
.ai{display:inline-block;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--raised);color:var(--t2)}
.sim{display:inline-block;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--warnbg);color:var(--warn);margin-left:6px;vertical-align:1px}
.kp{display:inline-block;border-radius:999px;padding:5px 11px;font-size:13px;background:var(--soft);color:var(--softfg);margin:6px 6px 0 0}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ctl);border-radius:12px;padding:9px 16px;font-size:14px;background:var(--card);min-height:44px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.btn.g{border-color:transparent;color:var(--t2);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.steps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--t3)}
.steps span.d{background:var(--soft);color:var(--softfg)}
.steps span.c{background:var(--accent);color:var(--onacc)}
.pbar{height:8px;border-radius:4px;background:var(--bar);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.cite{display:inline-block;border:none;background:var(--soft);color:var(--softfg);border-radius:6px;padding:1px 7px;font-size:13px;margin:0 2px;min-height:24px}
.cite.off{background:var(--raised);color:var(--t3);text-decoration:line-through}
.q{font-size:16px;line-height:1.6;margin:4px 0 8px;font-weight:500}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;margin:8px 0 0;background:var(--card);min-height:44px}
.opt em{font-style:normal;color:var(--t2);width:16px;flex:none}
.opt.bad{border:2px solid var(--bad);background:var(--badbg)}
.opt.good{border:2px solid var(--ok);background:var(--okbg)}
.opt:disabled{cursor:default}
.expl{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;margin-top:10px}
.prog{display:flex;gap:5px;margin:2px 0 6px}
.prog i{width:30px;height:5px;border-radius:3px;background:var(--bar)}
.prog i.g{background:var(--ok)}.prog i.b{background:var(--bad)}
.sug{border:1.5px solid var(--accent);border-radius:16px;background:var(--raised);padding:14px 16px;margin-top:6px}
.sug .lb2{font-size:13px;color:var(--accent);margin-bottom:6px}
.sug .chg{font-size:14px;line-height:1.7}
.okline{font-size:13px;color:var(--ok);margin-top:8px}
.okline button{border:none;background:none;color:var(--accent);padding:4px 6px;min-height:32px;text-decoration:underline}
.daysep{text-align:center;font-size:13px;color:var(--t2);margin:6px 0 16px;display:flex;align-items:center;gap:12px}
.daysep:before,.daysep:after{content:"";flex:1;height:1px;background:var(--line)}
.compose{flex:none;padding:6px 24px 16px}
.qr{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qr button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--t1);min-height:36px}
.qr button.hot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.ibar{display:flex;align-items:center;gap:8px;border:1px solid var(--ctl);border-radius:16px;background:var(--card);padding:6px}
.ibar .ic{width:40px;height:40px;border:none;border-radius:10px;background:var(--raised);font-size:18px;color:var(--t2);flex:none}
.ibar .ic.hot{background:var(--accent);color:var(--onacc);animation:pulse 1.4s ease-in-out infinite}
.ibar input{flex:1;min-width:0;border:none;background:transparent;font-size:15px;color:var(--t1);padding:8px 4px}
.ibar input:focus{outline:none}
.ibar .go{width:44px;height:40px;border:none;border-radius:10px;background:var(--accent);color:var(--onacc);font-size:16px;flex:none}
.wpane{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.wph{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.wph button{margin-left:auto;border:none;background:none;color:var(--t2);font-size:20px;width:44px;height:44px}
.wpb{padding:18px 22px;overflow-y:auto;flex:1;font-size:14px;line-height:1.75}
.wpb h2{font-size:15px;margin:18px 0 4px}
.wpb ul{padding-left:20px;margin:4px 0}
.term{display:grid;grid-template-columns:96px 1fr;gap:6px 12px}
.term b{font-weight:600}
.page{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);margin-top:10px}
.page .pn{font-size:12px;color:var(--t2);margin-bottom:4px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.mrow{display:grid;grid-template-columns:112px 1fr 44px;gap:10px;align-items:center;margin:10px 0;font-variant-numeric:tabular-nums}
.mrow .tr{height:10px;border-radius:5px;background:var(--bar);overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--accent);transition:width .8s}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.mini div{background:var(--raised);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--t2)}
.mini b{display:block;font-size:20px;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--ok);font-weight:600}
.spr{display:inline-block;line-height:0}
@media (max-width:900px){
 .app,.app.wp{grid-template-columns:minmax(0,1fr)}
 .rail{display:none}
 .wpane{position:fixed;inset:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
 .stream,.compose{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .ch{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .mobjump{display:inline-block!important}
}
.mobjump{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v3：目标拆解、强度、小满的 5 个时刻 */
.welcome{display:flex;gap:16px;align-items:center;background:var(--pp);border-radius:18px;padding:16px 18px;margin:0 0 16px;animation:in .3s ease-out}
.welcome b{display:block;font-size:18px;font-weight:600;margin-bottom:2px}
.welcome span.tx{font-size:14px;color:var(--t2);line-height:1.6}
.party{display:flex;gap:16px;align-items:center;border:1.5px solid var(--ok);background:var(--okbg);border-radius:18px;padding:16px 18px;margin:0 0 16px 46px;animation:in .3s ease-out}
.party .tx>b{display:block;font-size:17px;font-weight:600;margin-bottom:4px}
.party li b{color:var(--accent);margin-right:4px}
.party .tx{font-size:14px;line-height:1.7;min-width:0}
.party ul{margin:4px 0 0;padding-left:18px}
.goal{border:1.5px solid var(--accent);border-radius:16px;background:var(--raised);padding:14px 16px;margin-top:6px}
.goal .gh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.goal .gh b{font-size:16px}
.goal .gh small{display:block;font-size:13px;color:var(--accent)}
.phase{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;font-size:14px;line-height:1.6;margin:6px 0}
.phase span:nth-child(odd){color:var(--t2)}
.three{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.three span{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.three b{color:var(--accent);font-weight:600;margin-right:4px}
.src{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-right:6px;line-height:18px}
.ri.done .src{color:var(--t3);border-color:var(--t3)}
.lvl{display:none;margin:2px 4px 6px}
.lvl.on{display:block}
.lvl .seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ctl);border-radius:10px;overflow:hidden}
.lvl .seg button{border:none;background:var(--card);font-size:13px;padding:8px 0;min-height:40px;color:var(--t2)}
.lvl .seg button+button{border-left:1px solid var(--line)}
.lvl .seg button[aria-pressed="true"]{background:var(--accent);color:var(--onacc);font-weight:600}
.lvl small{display:block;font-size:12px;color:var(--t2);margin-top:5px}
.emptyx{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;font-size:13px;color:var(--t2);text-align:center;line-height:1.6}
.react{display:inline-block;vertical-align:-4px;margin-right:6px}
.jrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jrow .jump{padding:8px;font-size:13px}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px}
.pick button small{display:block;color:var(--t2);font-size:13px}
.pick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--soft);color:var(--softfg)}
.qz details{margin-top:6px;font-size:14px}
.qz summary{cursor:pointer;color:var(--accent);min-height:32px;display:flex;align-items:center}
.rv{border-top:1px solid var(--line);padding:8px 0;line-height:1.6}
.rv b{display:block;font-weight:500}
.rv span{color:var(--t2);font-size:13px}
.hard{font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:1px 6px}
</style>

<div class="demobar" role="status">
  <b>演示 · 直接方案</b>
  <span class="dots" id="dots"></span>
  <span class="hint" id="hint"></span>
  <button id="mobJump" class="mobjump" hidden>跳到明天</button>
  <button id="restart">重新开始</button>
</div>

<div class="app" id="app">
  <aside class="rail">
    <div class="logo">慢慢</div>
    <div class="rh"><span>今天 · 最多三件</span><span id="todayCount"></span></div>
    <div class="lvl" id="lvl">
      <div class="seg" role="group" aria-label="今天的强度">
        <button type="button" data-l="light" aria-pressed="false">轻松</button>
        <button type="button" data-l="normal" aria-pressed="true">正常</button>
        <button type="button" data-l="sprint" aria-pressed="false">冲刺</button>
      </div>
      <small id="lvlNote">约 30 分钟 · 件数不变，每件的分量变</small>
    </div>
    <div id="today"></div>
    <div class="rh"><span>我的资料 · PMP</span><span id="lecCount"></span></div>
    <div id="lecs"></div>
    <div class="bot">
      <button class="jump" id="jump" disabled>跳到明天<small>演示用 · 把“今天”往后拨一天</small></button>
      <div class="jrow"><button class="jump" id="jump3" disabled>跳过两天<small>演示中断后回来</small></button><button class="jump" id="jump9" disabled>跳过 8 天<small>很久没来</small></button></div>
    </div>
  </aside>

  <main class="chat">
    <div class="ch">
      <span class="spr" id="headSpr" data-s="wave" data-z="2"></span>
      <div><div class="nm">小满</div><div class="st" id="state">在线</div></div>
      <div class="day" id="day"></div>
    </div>
    <div class="stream" id="stream"><div class="col" id="col"></div></div>
    <div class="compose"><div class="col" style="margin:0 auto">
      <div class="qr" id="qr"></div>
      <form class="ibar" id="form">
        <button type="button" class="ic" id="plus" aria-label="交资料">＋</button>
        <button type="button" class="ic" id="at" aria-label="指定一讲">@</button>
        <input id="inp" autocomplete="off" placeholder="跟小满说，或把资料交给它…">
        <button class="go" aria-label="发送">↑</button>
      </form>
    </div></div>
  </main>

  <aside class="wpane" id="wpane" hidden>
    <div class="wph"><span id="wpTitle"></span><button id="wpClose" aria-label="关闭工作台">×</button></div>
    <div class="wpb" id="wpBody"></div>
  </aside>
</div>

<script>
// ---------- 小满像素形象 ----------
const BASE=["..............g.......",".............yyy......","...........o.yyy......","..........obooooo.....","...ooooooobbbbbbbo....","..obbbbbbbbbbbebbbo...",".obbbbbbbbbbbbbbbbbo..",".obbbbbbbbbbbbbbbbno..",".obbbbbbbbbbbbllllo...",".obbbbbbbbbbbbbbbo....","..obbbbbbbbbbbbbo.....","..obboooooooobbo......","...ff........ff......."];
const PC={o:"#4a3020",b:"#a8743f",l:"#d2a06a",e:"#1e1410",n:"#2a1a10",f:"#4a3020",y:"#f0a030",g:"#5a9a3a",m:"#8a8478",s:"#e8b020"};
const MOD={idle:[],think:[[20,0,"m"],[21,0,"m"],[21,1,"m"],[20,2,"m"],[20,4,"m"]],cheer:[[14,5,"b"],[13,5,"e"],[15,5,"e"],[14,4,"e"],[1,2,"s"],[4,0,"s"],[20,3,"s"],[21,6,"s"]],wave:[[17,10,"o"],[18,9,"o"],[19,8,"o"],[19,7,"o"]]};

function runQuiz(items,opt){let i=0;const res=[],picks=[];
 const d=xm(`<div class="mc qz"></div>`);const box=d.querySelector('.qz');
 const ask=()=>{closePane();setState(opt.state||'在出题','idle');const Q=items[i];
  const prog=`<div class="prog">${items.map((_,j)=>`<i class="${j<res.length?(res[j]?'g':'b'):''}"></i>`).join('')}</div>`;
  box.innerHTML=`<h4>${opt.title} ${i+1} / ${items.length}<em>出自第 ${Q.l} 讲第 ${Q.p} 页</em>${Q.hard?'<span class="hard">难</span>':''}</h4>${prog}<div class="q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="opt" data-j="${j}"><em>${'ABCD'[j]}</em><span>${o}</span></button>`).join('')}<div class="res"></div>`;
  scrollDown();
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,right=j===Q.a;
   box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   b.classList.add(right?'good':'bad');if(!right)box.querySelector(`.opt[data-j="${Q.a}"]`).classList.add('good');
   setState(right?'为你高兴':'陪着你','');$('#headSpr').dataset.s=right?'cheer':'idle';$('#headSpr').removeAttribute('data-done');paintSprites();
   res.push(right);picks.push(j);
   const last=i===items.length-1;
   const r=box.querySelector('.res');
   r.innerHTML=`<div class="expl">${spr(right?'cheer':'idle',1.2).replace('class="spr"','class="spr react"')}${right?'<b style="color:var(--ok)">答对了。</b>':'<b style="color:var(--bad)">这道没对上，正确答案是 '+'ABCD'[Q.a]+'。</b>'+(opt.redo?'没关系，这道放回“补一补”，过几天我换个问法再出。':'这类题常错，没关系。')}${Q.e}${Q.l===6?`<button class="cite" data-p="${Q.p}">第 ${Q.p} 页</button>`:''}</div><div class="btns"><button class="btn p next">${last?'看结果':'下一题'}</button></div>`;
   paintSprites(r);const c=r.querySelector('.cite');if(c)c.onclick=()=>openPage(Q.p);scrollDown();
   r.querySelector('.next').onclick=()=>{i++;if(i<items.length)ask();else finish();};});};
 const finish=()=>{const n=res.filter(Boolean).length;
  box.innerHTML=`<h4>${opt.name} · ${items.length} 道题<em>答对 ${n} 道</em></h4><div class="prog">${res.map(x=>`<i class="${x?'g':'b'}"></i>`).join('')}</div>
<details><summary>回看题目和解析</summary>${items.map((Q,k)=>`<div class="rv"><b>${res[k]?'✓':'✗'} ${Q.q}</b><span>你选 ${'ABCD'[picks[k]]}，正确 ${'ABCD'[Q.a]}。${Q.e}</span></div>`).join('')}</details>`;
  opt.done(res);};
 ask();}
